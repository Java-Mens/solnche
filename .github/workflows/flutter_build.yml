name: Flutter Build & Release

on:
  push:
    branches: [ master-slave ]
    tags:
      - 'v*'  # Trigger on version tags for releases
  pull_request:
    branches: [ master-slave ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - linux
          - test_only

env:
  FLUTTER_VERSION: '3.47.2'
  APP_DIR: 'solar_clock_app'

jobs:
  # Job 1: Code Quality & Tests
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          flutter pub get
      
      - name: Analyze code
        run: |
          cd ${{ env.APP_DIR }}
          flutter analyze --no-fatal-infos --no-fatal-warnings
      
      - name: Run tests with coverage
        run: |
          cd ${{ env.APP_DIR }}
          flutter test --coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ env.APP_DIR }}/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Job 2: Android Build
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'android') || github.event_name != 'workflow_dispatch'
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          flutter pub get
      
      - name: Enable Android platform
        run: |
          cd ${{ env.APP_DIR }}
          flutter config --enable-linux-desktop
      
      - name: Build Debug APK
        run: |
          cd ${{ env.APP_DIR }}
          flutter build apk --debug
      
      - name: Build Release APK
        run: |
          cd ${{ env.APP_DIR }}
          flutter build apk --release
      
      - name: Build App Bundle (Google Play)
        run: |
          cd ${{ env.APP_DIR }}
          flutter build appbundle --release
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/release/app-release.apk
          retention-days: 30
      
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-appbundle
          path: ${{ env.APP_DIR }}/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/release/app-release.apk
            ${{ env.APP_DIR }}/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Linux Build
  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'linux') || github.event_name != 'workflow_dispatch'
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Enable Linux desktop
        run: |
          flutter config --enable-linux-desktop
      
      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          flutter pub get
      
      - name: Build Linux Release
        run: |
          cd ${{ env.APP_DIR }}
          flutter build linux --release
      
      - name: Create Linux package
        run: |
          cd ${{ env.APP_DIR }}
          mkdir -p release/solar_clock_app
          cp -r build/linux/x64/release/bundle/* release/solar_clock_app/
      
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ${{ env.APP_DIR }}/release/
          retention-days: 30
      
      - name: Create Linux Release Asset (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd ${{ env.APP_DIR }}/release
          tar -czvf solar_clock_linux_${{ github.ref_name }}.tar.gz solar_clock_app
      
      - name: Upload Linux Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.APP_DIR }}/release/solar_clock_linux_*.tar.gz
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality-check
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          flutter pub get
      
      - name: Run dart audit
        run: |
          cd ${{ env.APP_DIR }}
          dart pub outdated --mode=null-safety
      
      - name: Check for hardcoded secrets
        run: |
          cd ${{ env.APP_DIR }}
          ! grep -r "API_KEY\|SECRET\|PASSWORD" --include="*.dart" lib/ || echo "Warning: Potential secrets found in code"
