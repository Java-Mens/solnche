name: solar_clock_app
description: A Flutter application that displays local apparent solar time based on user location with comparison feature.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Location services
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  
  # Solar calculations (Standard Library)
  sunrise_sunset_calc: ^3.0.0
  
  # State management
  provider: ^6.1.2
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Notifications with timezone support
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  
  # Shared preferences for storing settings
  shared_preferences: ^2.3.3
  
  # Home screen widget (Android)
  home_widget: ^0.6.0
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Assets if needed
  # assets:
  #   - images/
